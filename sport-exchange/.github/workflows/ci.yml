name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  contracts:
    name: Contracts (buf lint + generate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Buf setup + cache (speeds up lint/generate)
      - uses: bufbuild/buf-setup-action@v1
      - name: Cache Buf module
        uses: actions/cache@v4
        with:
          path: ~/.cache/buf
          key: buf-${{ runner.os }}-${{ hashFiles('**/buf.yaml') }}
          restore-keys: |
            buf-${{ runner.os }}-

      - name: Lint & Generate
        run: |
          cd contracts
          buf lint
          buf generate

      - name: Verify generated code is up-to-date
        run: |
          # Fail if codegen would change tracked files
          if ! git diff --quiet --exit-code -- contracts/gen gateway/src/__generated__/proto; then
            echo "::error::Contracts codegen is stale. Run 'cd contracts && buf generate'."
            git --no-pager diff -- contracts/gen gateway/src/__generated__/proto | tail -n 200 || true
            exit 1
          fi

  node:
    name: Gateway (TypeScript build)
    runs-on: ubuntu-latest
    needs: contracts
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm run -s build --if-present
      - run: npm test --if-present

  rust:
    name: Engine (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cargo check + clippy
        working-directory: engine
        run: |
          cargo check --all-targets
          cargo clippy --all-targets -- -D warnings

  go:
    name: Go services (ledger)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - run: go mod download
      - run: go vet ./...
      - run: go test ./...

  python:
    name: Price Service (Python/Node mock)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: price-svc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python deps (if any)
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Optional pytest (doesn't fail CI if absent)
        run: |
          if [ -f pytest.ini ] || [ -d tests ]; then pytest -q || true; fi

  docker-build:
    name: Docker build (compose images, cached)
    runs-on: ubuntu-latest
    needs: [contracts, node, rust, go, python]
    env:
      COMPOSE_FILE: infra/local/docker-compose.yml
    steps:
      - uses: actions/checkout@v4

      # Buildx + Bake with GitHub cache → fast incremental builds
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build images via docker bake (with cache)
        uses: docker/bake-action@v5
        with:
          files: |
            ${{ env.COMPOSE_FILE }}
          targets: |
            gateway
            price-svc
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
          load: true

  e2e-smoke:
    name: E2E Smoke + Integration (gateway + price-svc)
    runs-on: ubuntu-latest
    needs: docker-build
    env:
      COMPOSE_FILE: infra/local/docker-compose.yml
      GATEWAY_URL: http://localhost:4000
      PLAYER_ID: ETH
      DUMP_DIR: artifacts
      # Fast knobs for CI:
      PRICE_SVC_TIMEOUT_MS: "1000"
      PRICE_SVC_RETRIES: "3"
      PRICE_SVC_BACKOFF_BASE_MS: "100"
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/*.sh || true

      - name: Start minimal stack
        run: docker compose -f "$COMPOSE_FILE" up -d price-svc gateway

      - name: Health checks
        run: |
          if [ -x scripts/check_health.sh ]; then
            ./scripts/check_health.sh
          else
            # Fallback inline health wait (60s total)
            for i in $(seq 1 60); do
              if curl -fsS "${GATEWAY_URL}/healthz" >/dev/null; then
                echo "gateway healthy"
                exit 0
              fi
              sleep 1
            done
            echo "gateway did not become healthy in time" >&2
            exit 1
          fi

      - name: Smoke /api/quote
        run: |
          if [ -x scripts/smoke_quote.sh ]; then
            ./scripts/smoke_quote.sh
          else
            curl -fsS "${GATEWAY_URL}/api/quote?playerId=${PLAYER_ID}" | tee /dev/stderr | jq -e '.playerId and .bid and .ask and .mid and .tsMs and .reqId' >/dev/null
          fi

      - name: Integration test
        run: |
          if [ -x scripts/integration.sh ]; then
            chmod +x scripts/integration.sh
            ./scripts/integration.sh
          else
            echo "No scripts/integration.sh found; skipping explicit integration step."
          fi

      # Collect logs/artifacts on failure
      - name: Dump compose logs (always)
        if: always()
        run: |
          mkdir -p $DUMP_DIR || true
          docker compose -f "$COMPOSE_FILE" logs > "$DUMP_DIR/compose-logs.txt" 2>&1 || true
          ls -lah $DUMP_DIR || true

      - name: Upload artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-${{ github.run_id }}
          path: |
            artifacts/**
            !artifacts/**/*.tmp

      - name: Teardown (always)
        if: always()
        run: docker compose -f "$COMPOSE_FILE" down -v --remove-orphans

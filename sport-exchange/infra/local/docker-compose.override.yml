# /Users/douglas/sport-exchange/infra/local/docker-compose.override.yml
# remove fragile healthchecks for nats/price-svc; only require postgres healthy
services:
  nats:
    image: nats:2.10-alpine
    command: ["-js","-m","8222"]
    ports: ["4222:4222","8222:8222"]
    volumes: ["natsdata:/data"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30

  price-svc:
    ports: ["18000:8000"]
    depends_on:
      nats: { condition: service_started }
      postgres: { condition: service_healthy }

  gateway:
    command: ["node","dist/standalone.js"]
    ports: ["${GATEWAY_PORT:-4000}:4000"]
    environment:
      NATS_URL: ${NATS_URL}
      PRICE_SVC_URL: ${PRICE_SVC_URL}
    depends_on:
      nats: { condition: service_started }
      price-svc: { condition: service_started }

  engine:
    ports: ["${ENGINE_PORT:-17000}:17000"]
    environment:
      NATS_URL: ${NATS_URL}
      PRICE_SVC_URL: ${PRICE_SVC_URL}
    depends_on:
      nats: { condition: service_started }
      price-svc: { condition: service_started }

  ledger:
    ports: ["${LEDGER_PORT:-16000}:16000"]
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_started }

volumes:
  pgdata:
  natsdata:

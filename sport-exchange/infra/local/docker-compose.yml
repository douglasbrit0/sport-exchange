name: sport-exchange-dev

services:
  postgres:
    image: postgres:16
    container_name: se_postgres
    environment:
      POSTGRES_USER: se_user
      POSTGRES_PASSWORD: se_pass
      POSTGRES_DB: se_core
    ports: ["5432:5432"]
    volumes: [ "se_pg_data:/var/lib/postgresql/data" ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U se_user -d se_core"]
      interval: 3s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.10-alpine
    container_name: se_nats
    command: ["nats-server", "-js", "-m", "8222", "--store_dir", "/data/jetstream"]
    ports: ["4222:4222", "8222:8222"]
    volumes:
      - se_nats_data:/data
    healthcheck:
      # uses wget; works on this image
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/varz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  price-svc:
    build:
      context: ../../tools/mocks/price_svc
    container_name: price-svc
    ports:
      - "18000:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8000/healthz"]
      interval: 5s
      timeout: 2s
      retries: 20

  gateway:
    build: 
      context: ../../gateway
      dockerfile: Dockerfile
      additional_contexts:
        contracts: ../../contracts
    container_name: se_gateway
    ports:
      - "4000:4000"
    environment:
      # Runtime mode
      NODE_ENV: "production"

      # HTTP server
      PORT: "4000"

      # Price service client
      PRICE_SVC_URL: "http://price-svc:8000"
      PRICE_SVC_TIMEOUT_MS: "3000"        # client timeout
      PRICE_SVC_RETRIES: "3"              # retry count on network/5xx
      PRICE_SVC_BACKOFF_BASE_MS: "100"    # base for exponential backoff (+ jitter)

      # Optional features
      GRAPHQL_ENABLED: "false"            # flip to "true" when you’re ready
      NATS_URL: "nats://nats:4222"        # if/when gateway uses NATS

      # Misc you already had
      GIT_SHA: "local"
      MOCK_PLAYERS: "0"
    depends_on:
      price-svc:
        condition: service_healthy

  ledger:
    build: ../../ledger
    container_name: se_ledger
    environment:
      PORT: 7001
      DATABASE_URL: postgres://se_user:se_pass@postgres:5432/se_core?sslmode=disable
      NATS_URL: nats://nats:4222
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
    ports: ["7001:7001"]

  reconciler:
    build: ../../reconciler
    container_name: se_reconciler
    environment:
      PORT: 7002
      NATS_URL: nats://nats:4222
    depends_on:
      nats: { condition: service_healthy }
    ports: ["7002:7002"]

  engine:
    build: 
      context: ../../engine
      dockerfile: Dockerfile
      additional_contexts:
        contracts: ../../contracts
    container_name: engine
    environment:
      PORT: 7003
      NATS_URL: nats://nats:4222
    depends_on:
      nats: { condition: service_healthy }
    ports: ["7003:7003"]

  signals:
    build: ../../signals
    container_name: se_signals
    environment:
      PORT: 8001
      NATS_URL: nats://nats:4222
    depends_on:
      nats: { condition: service_healthy }
    ports: ["8001:8001"]

volumes:
  se_pg_data:
  se_nats_data:

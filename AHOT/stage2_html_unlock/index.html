<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Stage 2 — HTML Unlock</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding: 2rem; }
      .card { max-width: 720px; margin: 0 auto; padding: 1.5rem; border: 1px solid #ccc; border-radius: 12px; }
      .hidden { display: none; }
      .ok { border-color: #4caf50; }
      code { background: #f5f5f5; padding: 0.2rem 0.3rem; border-radius: 6px; }
      small { color: #666; }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <h1>Stage 2 — HTML Unlock</h1>
      <p>Enter the Stage 1 password (from GitHub) to reveal the next key.</p>
      <input id="pw" type="password" placeholder="Stage 1 password" />
      <button id="go">Unlock</button>
      <div id="result" class="hidden">
        <h3>Great!</h3>
        <p>The Stage 2 password is: <code id="stage2pw"></code></p>
        <p>Use it on Stage 3 (open <code>../stage3_web_puzzle/index.html</code>).</p>
        <small>Note: Secrets are stored encrypted in this file and only decoded after the correct password is entered.</small>
      </div>
    </div>

    <script>
      // Encrypted blob: Base64( ROT13( "CITRINE-FOX" ) )
      const ENC = "UFZHRVZBUi1TQks=";
      const EXPECTED_PW = "OPAL-RELAY";

      function rot13(s) {
        return s.replace(/[a-zA-Z]/g, c => {
          const base = c <= 'Z' ? 65 : 97;
          return String.fromCharCode((c.charCodeAt(0) - base + 13) % 26 + base);
        });
      }

      document.getElementById('go').addEventListener('click', () => {
        const val = document.getElementById('pw').value.trim();
        if (val !== EXPECTED_PW) { alert("Nope — check Stage 1."); return; }
        const decoded = atob(ENC);
        const secret = rot13(decoded);
        document.getElementById('stage2pw').textContent = secret;
        document.getElementById('result').classList.remove('hidden');
        document.getElementById('card').classList.add('ok');
      });
    </script>
  </body>
</html>
